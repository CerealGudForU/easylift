# Builds a signed Android APK for every version tag (v1.2.3) and publishes it as a GitHub Release.
# The app's in-app updater reads the latest release and installs EasyLift.apk over the old version.
#
# Needs, in the repo settings (Settings → Secrets and variables → Actions):
#   secrets   ANDROID_KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
#   variables EXPO_PUBLIC_SUPABASE_URL, EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY
#
# Release: git tag v0.1.1 && git push origin v0.1.1
name: Android release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Version from tag
        id: version
        run: |
          V="${GITHUB_REF_NAME#v}"
          if ! [[ "$V" =~ ^[0-9]+\.[0-9]{1,2}\.[0-9]{1,2}$ ]]; then
            echo "::error::Tag must look like v1.2.3 (minor and patch at most 99), got $GITHUB_REF_NAME"; exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "APP_VERSION=$V" >> "$GITHUB_ENV"

      - name: Check configuration
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          missing=0
          [ -n "$KS" ] || { echo "::error::Secret ANDROID_KEYSTORE_BASE64 is not set"; missing=1; }
          [ -n "$EXPO_PUBLIC_SUPABASE_URL" ] || { echo "::error::Variable EXPO_PUBLIC_SUPABASE_URL is not set"; missing=1; }
          [ -n "$EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY" ] || { echo "::error::Variable EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY is not set"; missing=1; }
          exit $missing

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci

      # Same checks as CI, so a release is never built from code that fails them.
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

      - name: Restore the release keystore
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KS" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "EASYLIFT_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Generate the Android project
        run: npx expo prebuild -p android --clean --no-install

      - name: Build the APK
        working-directory: android
        env:
          EASYLIFT_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          EASYLIFT_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          EASYLIFT_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: NODE_ENV=production ./gradlew assembleRelease --no-daemon

      - name: Check the signature and version
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "$APK" | tee certs.txt
          if grep -qi "CN=Android Debug" certs.txt; then echo "::error::APK is signed with the debug key"; exit 1; fi
          "$BT/aapt2" dump badging "$APK" | head -1
          "$BT/aapt2" dump badging "$APK" | head -1 | grep -q "versionName='${{ steps.version.outputs.version }}'"
          mkdir out
          cp "$APK" "out/EasyLift-${{ steps.version.outputs.version }}.apk"
          cp "$APK" out/EasyLift.apk
          rm -f "$RUNNER_TEMP/release.jks"

      - uses: softprops/action-gh-release@v2
        with:
          name: EasyLift ${{ steps.version.outputs.version }}
          generate_release_notes: true
          make_latest: true
          files: |
            out/EasyLift-${{ steps.version.outputs.version }}.apk
            out/EasyLift.apk
